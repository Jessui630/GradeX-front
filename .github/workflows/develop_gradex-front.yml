name: GradeX Frontend CI and Production Deploy

on:
  push:
    branches:
      - main
      - develop
      - release
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Runtime dependency audit
        run: npm audit --omit=dev

      - name: Build GradeX frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Determine production artifact eligibility
        id: production
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Prepare Node 24 deployment package
        if: steps.production.outputs.enabled == 'true'
        run: |
          mkdir -p deploy-root
          cp -R dist deploy-root/dist
          cp server.mjs deploy-root/server.mjs
          cp deploy/package.json deploy-root/package.json
          printf '{"commit":"%s","ref":"%s","runId":"%s","runAttempt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > deploy-root/build-info.json
          cd deploy-root
          zip -r ../gradex-frontend.zip .
          cd ..
          sha256sum gradex-frontend.zip > gradex-frontend.sha256

      - name: Upload production artifact
        if: steps.production.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gradex-frontend
          path: |
            gradex-frontend.zip
            gradex-frontend.sha256
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: gradex-frontend-production
      cancel-in-progress: false

    steps:
      - name: Download artifact from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: gradex-frontend
          path: .
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify artifact integrity and commit
        run: |
          sha256sum -c gradex-frontend.sha256
          unzip -p gradex-frontend.zip build-info.json | \
            jq -e --arg sha "$GITHUB_SHA" '.commit == $sha and .ref == "refs/heads/main"' >/dev/null

      - name: Validate OIDC configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_AC7C915F314A49BCA9842FA13BA103FE }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_046EC26F405F4AC085DCA2472B99080F }}
        run: |
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"

      - name: Login to Azure with OIDC
        # Identidad esperada: oidc-msi-b6ba. El Client ID se toma de la variable AZURE_CLIENT_ID.
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AC7C915F314A49BCA9842FA13BA103FE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_046EC26F405F4AC085DCA2472B99080F }}

      - name: Verify App Service target (read-only)
        shell: bash
        run: |
          set -euo pipefail
          az account show --query "{name:name,id:id,state:state}" -o json

          APP_JSON=$(az webapp show --resource-group gradex-rg --name gradex-front --query "{id:id,name:name,state:state,kind:kind,linuxFxVersion:siteConfig.linuxFxVersion}" -o json)
          test -n "$APP_JSON"
          echo "$APP_JSON" | jq -e '.name == "gradex-front" and .state == "Running" and (.kind | startswith("app,linux")) and (.kind | test("container") | not) and (.linuxFxVersion | tostring | startswith("NODE|24"))' >/dev/null

          APP_ID=$(echo "$APP_JSON" | jq -er '.id')
          APP_RESOURCE=$(az resource show --ids "$APP_ID" -o json)
          test -n "$APP_RESOURCE"
          PLAN_ID=$(echo "$APP_RESOURCE" | jq -er '.properties.serverFarmId // empty')
          test -n "$PLAN_ID"

          EXPECTED_PLAN_ID=$(az resource show --resource-group gradex-rg --name ASP-gradexrg-8bed --resource-type Microsoft.Web/serverfarms --query id -o tsv)
          test -n "$EXPECTED_PLAN_ID"
          if [ "${PLAN_ID,,}" != "${EXPECTED_PLAN_ID,,}" ]; then
            echo "El App Service no está asociado al plan ASP-gradexrg-8bed." >&2
            exit 1
          fi

          PLAN_JSON=$(az resource show --ids "$PLAN_ID" -o json)
          test -n "$PLAN_JSON"
          echo "$PLAN_JSON" | jq -e '
            .name == "ASP-gradexrg-8bed" and
            .kind == "linux" and
            .sku.name == "F1" and
            .sku.tier == "Free" and
            .sku.capacity == 1 and
            .properties.reserved == true
          ' >/dev/null

      - name: Configure Node 24 startup
        run: |
          az webapp config set \
            --resource-group gradex-rg \
            --name gradex-front \
            --startup-file "node server.mjs"

      - name: Deploy only gradex-front
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gradex-front'
          package: gradex-frontend.zip

      - name: Deployment summary
        run: |
          echo "App: gradex-front"
          echo "Resource group: gradex-rg"
          echo "Plan: ASP-gradexrg-8bed (F1/Free)"
          echo "Commit: $GITHUB_SHA"
          echo "Artifact SHA-256: $(awk '{print $1}' gradex-frontend.sha256)"
