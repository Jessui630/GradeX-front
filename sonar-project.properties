sonar.projectKey=Jessui630_GradeX-front
sonar.organization=jessui630
sonar.projectName=GradeX-front
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8
sonar.sources=src,server.mjs,scripts
sonar.tests=src,e2e,server.test.js
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx,e2e/**/*.spec.js,server.test.js
sonar.exclusions=dist/**,coverage/**,coverage-*/**,test-results/**,playwright-report/**,blob-report/**,src/testing/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Keep the current GitHub check as the merge gate until the first CI analysis
# has been validated by a SonarCloud administrator.
sonar.qualitygate.wait=false
